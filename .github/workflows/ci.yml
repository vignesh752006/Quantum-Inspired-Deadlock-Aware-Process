name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compile
        run: mvn -B -ntp clean compile

      - name: Run test suite
        run: mvn -B -ntp test

      - name: Package
        run: mvn -B -ntp package -DskipTests

      - name: Smoke test the jar
        run: java -jar target/quantum-deadlock.jar help

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk-${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload jar
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: quantum-deadlock-jar
          path: target/quantum-deadlock.jar
          retention-days: 7

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fail if build artifacts or virtualenvs are tracked
        run: |
          set -euo pipefail
          status=0
          for pattern in '\\.class$' '^\\.venv/' '^venv/' '^target/' '^bin/.*\\.class$'; do
            matches=$(git ls-files | grep -E "$pattern" || true)
            if [ -n "$matches" ]; then
              echo "::error::Tracked files matching '$pattern':"
              echo "$matches" | head -20
              status=1
            fi
          done
          if [ "$status" -eq 0 ]; then
            echo "No build artifacts or virtualenvs are tracked."
          fi
          exit "$status"
